[project]
name = "fel-gastos"
version = "0.1.0"
description = "Categorizador automático de facturas electrónicas (FEL) del SAT desde Gmail."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "beautifulsoup4",
    "lxml",
    "python-dateutil",
    "supabase",
    "anthropic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
